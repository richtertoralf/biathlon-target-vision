name: Tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          npm install --prefix "$RUNNER_TEMP/btv-playwright" @playwright/test@1.62.1
          "$RUNNER_TEMP/btv-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Tablet, Erfassung, Monitor und synthetische Kamerabilder
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/btv-playwright/node_modules/@playwright/test"
          node tests/translation_browser.cjs
          node tests/tablet_browser.cjs
          node tests/capture_browser.cjs
          node tests/workflow_browser.cjs
          node tests/monitor_browser.cjs
          node tests/browser_smoke.cjs
          node tests/vision_browser.cjs
          node tests/sessions_browser.cjs
          node tests/administration_browser.cjs
          node tests/shell_browser.cjs
